name: LIBRARY-TEST
on: 
  # pull_request: 
  #   branches:
  #     - main
  #   paths:
  #     - 'mylib/**'
  push:
  workflow_dispatch:
jobs:
  test:
    name: cargo test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo test --manifest-path mylib/Cargo.toml
